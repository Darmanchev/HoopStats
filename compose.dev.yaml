services:
  db:
    ports:
      - "127.0.0.1:5433:5432"

  backend:
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app
        --host 0.0.0.0
        --port 8000
        --reload
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy