name: Release checks

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-secret
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/hoopstats_ci
      REDIS_URL: redis://localhost:6379/0
      REDIS_TEST_URL: redis://localhost:6379/1
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hoopstats_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d hoopstats_ci"
          --health-interval 5s --health-timeout 5s --health-retries 15
      redis:
        image: redis:7.4-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install uv==0.11.31
      - run: uv sync --frozen
      - run: uv run pytest -q
      - name: Validate PostgreSQL migration chain and latest rollback
        working-directory: backend
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade -1
          uv run alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose definitions
        run: |
          docker compose -f compose.yaml config --no-interpolate --quiet
          docker compose -f compose.prod.yaml config --no-interpolate --quiet
      - name: Build release images
        run: |
          docker build -f backend/Dockerfile -t hoopstats-backend:ci .
          docker build --target production --build-arg APP_HOST=localhost -t hoopstats-frontend:ci frontend
